<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配色生成 — 색면 조합 생성기</title>
<meta name="description" content="배경 위 색면 조합 생성기. 일본 전통색 200가지로 배경과 색면을 고르고, 배경만 바꿔 시리즈를 만들고, 고화질 PNG로 저장하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="配色生成 — 배경 위 색면 조합 생성기">
<meta property="og:description" content="전통색 200 · 배경 후보 · 색면 1–5 · PNG 3600px">
<meta property="og:url" content="https://gigabgim59-sketch.github.io/maco/">
<meta property="og:image" content="https://gigabgim59-sketch.github.io/maco/haishoku-thumbnail.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://gigabgim59-sketch.github.io/maco/haishoku-thumbnail.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6e6e1; --panel:#f3f3ef; --ink:#1d1d1f; --sub:#6c6b67; --line:#d0cfc8;
  --chip:#ebebe6; --accent:#b0632a; --accent-ink:#ffffff; --shadow:rgba(20,20,30,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --panel:#202125; --ink:#ecebe7; --sub:#9c9a95; --line:#34353b;
    --chip:#292a2f; --accent:#d9803f; --accent-ink:#1b1b22; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --panel:#202125; --ink:#ecebe7; --sub:#9c9a95; --line:#34353b;
  --chip:#292a2f; --accent:#d9803f; --accent-ink:#1b1b22; --shadow:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Apple SD Gothic Neo","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(14px,3vw,36px)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:"Shippori Mincho",serif;font-weight:700;font-size:clamp(26px,4.4vw,40px);letter-spacing:.1em;margin:0;line-height:1.1}
.sub{margin:0;color:var(--sub);font-size:13px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:28px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.canvas-box{display:flex;justify-content:center}
#cv{display:block;max-width:100%;max-height:calc(100vh - 170px);width:auto;height:auto;box-shadow:0 22px 50px -28px var(--shadow)}
.namebar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.nm{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;cursor:pointer;font-family:"Shippori Mincho",serif;font-size:14px}
.nm i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.12);display:block}
.nm small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;color:var(--sub)}
.nm:hover{border-color:var(--ink)}

.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.act{padding:11px 4px;border:1px solid var(--line);background:var(--bg);border-radius:9px;cursor:pointer;font-size:13px;white-space:nowrap}
.act:hover:not(:disabled){border-color:var(--ink)}
.act:disabled{opacity:.4;cursor:default}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.dl{grid-column:1 / -1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;font-size:14px;padding:13px}
.act.dl[aria-busy="true"]{opacity:.6}

.tabs{display:flex;gap:4px;margin:16px 0 14px;background:var(--bg);padding:4px;border-radius:10px}
.tabs button{flex:1;padding:9px 2px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--sub);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
h3{font-size:13px;font-weight:500;color:var(--sub);margin:18px 0 9px}
h3:first-child{margin-top:2px}

.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row.bgrow{border-style:dashed}
.row .sw{width:52px;height:52px;border-radius:8px;border:1px solid rgba(0,0,0,.14);cursor:pointer;padding:0}
.row.bgrow .sw{border-radius:50%}
.row .meta{min-width:0;cursor:pointer;line-height:1.3}
.row .lab{display:block;font-size:11px;color:var(--sub)}
.row .meta b{font-family:"Shippori Mincho",serif;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta small{color:var(--sub);font-size:11px;white-space:nowrap}
.ic{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-size:15px;line-height:1;padding:0}
.ic:hover:not(:disabled){border-color:var(--ink)}
.ic:disabled{opacity:.3;cursor:default}
.ghost{width:100%;padding:10px;margin-top:10px;border:1px dashed var(--line);background:transparent;border-radius:9px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:var(--ink)}
.ghost.small{width:auto;padding:7px 12px;margin-top:8px;border-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border:1px solid var(--line);background:var(--chip);border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--accent)}
.rng span{font-size:12px;color:var(--sub);width:44px;text-align:right;font-variant-numeric:tabular-nums}

.comp{position:relative;display:block;width:100%;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.comp i{position:absolute;display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:12px}
.cand{position:relative;display:flex;flex-direction:column;gap:5px;padding:0;border:0;background:none;cursor:pointer;text-align:center}
.cand .t{font-family:"Shippori Mincho",serif;font-size:12.5px;line-height:1.2}
.cand .t small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;color:var(--sub)}
.cand.on .comp{outline:2.5px solid var(--ink);outline-offset:2px}
.cand:hover .comp{outline:2px solid var(--sub);outline-offset:2px}
.cand .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
.empty{color:var(--sub);font-size:13px;line-height:1.7;padding:10px 2px;grid-column:1/-1}

.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(10,10,14,.45)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media(min-width:861px){.sheet-card{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(760px,92vw);border-radius:16px}}
.sheet-card>*{flex:none}
.picker-card{height:82vh}
.sheet-head{display:flex;align-items:center;gap:8px}
.cur{flex:1;display:flex;align-items:center;gap:12px;min-width:0;font-size:13px;color:var(--sub);line-height:1.35}
.cur .mini{width:78px;flex:none;box-shadow:0 2px 8px -3px var(--shadow)}
.cur b{font-family:"Shippori Mincho",serif;font-size:21px;color:var(--ink)}
.cur em{font-style:normal;font-size:13px}
.cur small{font-size:12px}
.cur .dot{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);margin-right:6px;vertical-align:1px}
.x{width:36px;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:50%;cursor:pointer;flex:none}
.done{padding:9px 18px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:700}
.revert{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;font-size:12px;color:var(--sub)}
.near{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;padding:1px 0}
.near::-webkit-scrollbar,.fams::-webkit-scrollbar{display:none}
.nlabel{flex:none;font-size:11px;color:var(--sub);margin-right:2px}
.nr{flex:none;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-family:"Shippori Mincho",serif;font-size:13px}
.nr i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
#q{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.fams{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.fams .chip{flex:none;padding:6px 11px}
.fams .chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pscroll{flex:1 1 auto!important;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;margin:0 -2px;padding:0 2px 10px}
.sec h4{position:sticky;top:0;z-index:1;margin:0;padding:10px 2px 7px;background:var(--panel);font-size:13px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:6px}
.sec h4 i{width:9px;height:9px;border-radius:50%;display:block}
.sec h4 span{font-size:11px;opacity:.7}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.sq{aspect-ratio:1;border-radius:9px;border:1px solid rgba(0,0,0,.12);padding:0;cursor:pointer}
.sq.on,.nt.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4.5px var(--ink)}
.named{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.nt{display:flex;align-items:center;gap:8px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;min-width:0}
.nt i{width:32px;height:32px;border-radius:7px;border:1px solid rgba(0,0,0,.12);flex:none;display:block}
.nt span{min-width:0}
.nt b{font-family:"Shippori Mincho",serif;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt small{font-size:10px;color:var(--sub);white-space:nowrap}
.custom{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
.custom input{width:44px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.imgcard img{display:block;max-width:100%;max-height:52vh;margin:0 auto;border-radius:4px;box-shadow:0 10px 30px -18px var(--shadow)}
.savebtns{display:flex;flex-direction:column;gap:8px}
.savebtns .act{padding:13px}
.hint{margin:0;font-size:12px;color:var(--sub);line-height:1.6;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
  .main{grid-template-columns:1fr;gap:12px}
  .stage{z-index:5;background:var(--bg);padding:6px 0 10px;top:env(safe-area-inset-top,0px)}
  #cv{max-height:40vh}
  .namebar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:0 2px 2px;scrollbar-width:none}
  .nm{flex:none;font-size:13px}
  .side{padding:12px}
  .picker-card{height:82vh;height:82dvh}
  #picker .sheet-bg{background:rgba(10,10,14,.15)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>配色生成</h1>
    <p class="sub">배경 위 색면 조합 · 일본 전통색 <span id="ncount"></span>가지</p>
  </header>
  <div class="main">
    <section class="stage">
      <div class="canvas-box"><canvas id="cv" width="1200" height="700"></canvas></div>
      <div class="namebar" id="namebar"></div>
    </section>
    <section class="side">
      <div class="actions">
        <button class="act primary" id="bRandBg">🎲 배경</button>
        <button class="act" id="bRandBlk">🎲 색면</button>
        <button class="act" id="bUndo" disabled>↶ 되돌리기</button>
        <button class="act" id="bSwap">⇄ 순서</button>
        <button class="act dl" id="bSave">⤓ PNG 저장</button>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="edit" aria-selected="true">색 편집</button>
        <button role="tab" data-tab="cand" aria-selected="false">배경 후보</button>
        <button role="tab" data-tab="fav" aria-selected="false">즐겨찾기</button>
        <button role="tab" data-tab="opt" aria-selected="false">배치·출력</button>
      </nav>
      <div class="tabpane" id="t-edit">
        <h3>색을 누르면 바꿀 수 있어요</h3>
        <div class="rows" id="rows"></div>
        <button class="ghost" id="bAdd">＋ 색면 추가</button>
      </div>
      <div class="tabpane" id="t-cand" hidden>
        <div class="chips" id="cgroups"></div>
        <div class="cgrid" id="clist"></div>
      </div>
      <div class="tabpane" id="t-fav" hidden>
        <button class="ghost" id="bFav" style="margin-top:0">☆ 지금 조합 저장</button>
        <div class="cgrid" id="flist"></div>
      </div>
      <div class="tabpane" id="t-opt" hidden>
        <h3>색면 배치</h3>
        <div class="chips" id="dirs"></div>
        <h3>여백</h3>
        <div class="rng"><input type="range" id="margin" min="0" max="40" step="0.01"><span id="marginV"></span></div>
        <h3>색면 사이 간격</h3>
        <div class="rng"><input type="range" id="gap" min="0" max="15" step="0.5"><span id="gapV"></span></div>
        <h3>색면 질감</h3>
        <div class="rng"><input type="range" id="tex" min="0" max="100"><span id="texV"></span></div>
        <button class="ghost small" id="bSeed">질감 패턴 바꾸기</button>
        <h3>배경 질감</h3>
        <div class="chips" id="bgtex"></div>
        <h3>비율</h3>
        <div class="chips" id="ratios"></div>
        <h3>저장 해상도 (긴 변)</h3>
        <div class="chips" id="reses"></div>
        <button class="ghost small" id="bReset">레퍼런스 설정으로 되돌리기</button>
      </div>
    </section>
  </div>
</div>

<div class="sheet" id="picker" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet-card picker-card" role="dialog" aria-label="색 선택">
    <div class="sheet-head">
      <div class="cur" id="pcur"></div>
      <button class="revert" id="prevert" hidden>원래대로</button>
      <button class="done" id="pdone">완료</button>
    </div>
    <div class="near" id="near"></div>
    <input id="q" type="search" placeholder="이름·읽기·HEX 검색 (예: 藍, あお, 2792)" autocomplete="off">
    <div class="fams" id="fams"></div>
    <div class="pscroll" id="pscroll"></div>
    <label class="custom">목록에 없는 색 직접 지정 <input type="color" id="custom" value="#b0632a"></label>
  </div>
</div>

<div class="sheet" id="imgview" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card imgcard" role="dialog" aria-label="이미지 저장">
    <div class="sheet-head"><div class="cur"><b>이미지 저장</b></div><button class="x" data-close aria-label="닫기">✕</button></div>
    <img id="outimg" alt="생성된 색면 이미지">
    <div class="savebtns">
      <button class="act dl" id="bShare">사진에 저장 · 공유</button>
      <button class="act" id="bFile">파일로 다운로드</button>
    </div>
    <p class="hint">이미지를 길게 눌러 ‘사진 앱에 저장’을 선택해도 돼요.</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const RAW = `

$('#cgroups').addEventListener('click', e => {
  if (e.target.closest('#bReroll')) { rollCands(); renderCands(); return; }
  const b = e.target.closest('[data-g]'); if (!b) return; cgroup = b.dataset.g; if (cgroup === 'trad' && !cands.length) rollCands(); renderCands();
});
$('#clist').addEventListener('click', e => { const b = e.target.closest('.cand'); if (!b) return; push(); S.bg = b.dataset.c; refreshAll(); });

/* ---------- favourites ---------- */
function renderFavs() {
  $('#flist').innerHTML = favs.length ? favs.map((f, i) => '<div class="cand" data-f="' + i + '" role="button" tabindex="0">' + compHTML(f) + '<span class="t">' + esc(col(f.bg).n) + '<small>' + f.blocks.map(b => esc(col(b).n)).join(' · ') + '</small></span><button class="del" data-del="' + i + '" aria-label="삭제">✕</button></div>').join('')
    : '<p class="empty">마음에 드는 조합에서 ‘☆ 지금 조합 저장’을 누르면 여기에 모여요. 이 브라우저에 저장됩니다.</p>';
}
$('#bFav').onclick = () => { favs.unshift(JSON.parse(snap())); store.set('haishoku.favs.v1', favs); renderFavs(); toast('★ 저장했어요'); };
$('#flist').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) { favs.splice(+del.dataset.del, 1); store.set('haishoku.favs.v1', favs); renderFavs(); return; }
  const f = e.target.closest('[data-f]'); if (!f) return; push(); Object.assign(S, clone(favs[+f.dataset.f])); refreshAll();
});

/* ---------- layout / output ---------- */
function renderOpts() {
  $('#dirs').innerHTML = [['row', '가로로 나란히'], ['col', '세로로 쌓기']].map(([v, l]) => '<button class="chip" data-v="' + v + '" aria-pressed="' + (S.dir === v) + '">' + l + '</button>').join('');
  $('#bgtex').innerHTML = [[false, '없음 (단색)'], [true, '있음']].map(([v, l]) => '<button class="chip" data-v="' + v + '" aria-pressed="' + (S.bgTex === v) + '">' + l + '</button>').join('');
  $('#ratios').innerHTML = RATIOS.map(([k, l]) => { const [w, h] = dimsFor(k, S.res); return '<button class="chip" data-v="' + k + '" aria-pressed="' + (S.ratio === k) + '">' + l + '</button>'; }).join('');
  $('#reses').innerHTML = [2400, 3600].map(v => { const [w, h] = dimsFor(S.ratio, v); return '<button class="chip" data-v="' + v + '" aria-pressed="' + (S.res === v) + '">' + w + '×' + h + '</button>'; }).join('');
  $('#margin').value = S.margin; $('#marginV').textContent = S.margin + '%';
  $('#gap').value = S.gap; $('#gapV').textContent = S.gap + '%';
  $('#tex').value = S.tex; $('#texV').textContent = S.tex + '%';
}
function chipGroup(id, fn) { $(id).addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) fn(b.dataset.v); }); }
chipGroup('#dirs', v => { push(); S.dir = v; renderOpts(); draw(); });
chipGroup('#bgtex', v => { push(); S.bgTex = v === 'true'; renderOpts(); draw(); });
chipGroup('#ratios', v => { push(); S.ratio = v; renderOpts(); draw(); });
chipGroup('#reses', v => { S.res = +v; renderOpts(); });
function slider(id, key, labelId) {
  let dragging = false;
  $(id).addEventListener('input', e => { if (!dragging) { push(); dragging = true; } S[key] = +e.target.value; $(labelId).textContent = S[key] + '%'; draw(); });
  $(id).addEventListener('change', () => { dragging = false; renderCands(); renderFavs(); });
}
slider('#margin', 'margin', '#marginV'); slider('#gap', 'gap', '#gapV'); slider('#tex', 'tex', '#texV');
$('#bSeed').onclick = () => { S.seed = (Math.random() * 1e9) | 0; draw(); };
$('#bReset').onclick = () => { push(); Object.assign(S, clone(REF_LAYOUT)); refreshAll(); toast('레퍼런스 배치·질감으로 되돌렸어요'); };

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['edit', 'cand', 'fav', 'opt'].forEach(t => { $('#t-' + t).hidden = t !== b.dataset.tab; });
}));

/* ---------- picker (live preview) ---------- */
let pickT = 'bg', pickOrig = null, pickPushed = false, pview = 'swatch';
function openPicker(t) {
  pickT = t; pickOrig = getT(t); pickPushed = false; $('#q').value = '';
  $('#custom').value = col(pickOrig).h; $('#picker').hidden = false;
  renderPickerBody();
  requestAnimationFrame(() => { const on = document.querySelector('#pscroll .on'); if (on) on.scrollIntoView({ block: 'center' }); });
}
function closePicker() {
  if ($('#picker').hidden) return;
  $('#picker').hidden = true;
  const id = getT(pickT);
  if (id !== pickOrig) { recent = [id].concat(recent.filter(x => x !== id)).slice(0, 16); store.set('haishoku.recent.v1', recent); }
  refreshAll();
}
function renderPickerHead() {
  const cur = col(getT(pickT));
  const fam = (FAMSEC.find(f => f[0] === cur.f) || [0, '직접 지정'])[1];
  const label = pickT === 'bg' ? '배경' : '색면 ' + (pickT + 1);
  $('#pcur').innerHTML = compHTML(S, 'mini') + '<span><span class="dot" style="background:' + cur.h + '"></span><b>' + esc(cur.n) + '</b> <em>' + esc(cur.r) + '</em><br><small>' + label + ' · ' + cur.h.toUpperCase() + ' · ' + fam + '</small></span>';
  $('#prevert').hidden = getT(pickT) === pickOrig;
  const near = LIST.filter(c => c.id !== cur.id).map(c => [cdist(c.h, cur.h), c]).sort((a, b) => a[0] - b[0]).slice(0, 10).map(x => x[1]);
  $('#near').innerHTML = '<span class="nlabel">비슷한 색</span>' + near.map(c => '<button class="nr" data-id="' + c.id + '"><i style="background:' + c.h + '"></i>' + esc(c.n) + '</button>').join('');
  document.querySelectorAll('#pscroll [data-id]').forEach(b => b.classList.toggle('on', b.dataset.id === cur.id));
}
function tile(c) {
  return pview === 'name'
    ? '<button class="nt" data-id="' + c.id + '"><i style="background:' + c.h + '"></i><span><b>' + esc(c.n) + '</b><small>' + esc(c.r) + '</small></span></button>'
    : '<button class="sq" data-id="' + c.id + '" style="background:' + c.h + '" title="' + esc(c.n) + ' ' + c.h + '" aria-label="' + esc(c.n) + '"></button>';
}
function section(key, label, dot, list) {
  return '<section class="sec" data-sec="' + key + '"><h4>' + (dot ? '<i style="background:' + dot + '"></i>' : '') + label + ' <span>' + list.length + '</span></h4><div class="' + (pview === 'name' ? 'named' : 'sgrid') + '">' + list.map(tile).join('') + '</div></section>';
}
function renderPickerBody() {
  const q = $('#q').value.trim().toLowerCase().replace(/^#/, '');
  let html = '', chips = '';
  if (q) {
    const list = SORTED.filter(c => c.n.includes(q) || c.r.includes(q) || c.id.includes(q) || c.h.slice(1).includes(q));
    html = list.length ? section('q', '검색 결과', '', list) : '<p class="empty">‘' + esc(q) + '’에 맞는 색이 없어요</p>';
  } else {
    const rec = recent.map(col);
    if (rec.length) { html += section('recent', '최근', '', rec); chips += '<button class="chip" data-jump="recent">최근</button>'; }
    const refList = (pickT === 'bg' ? REF_BG : REF_BLOCKS).map(col);
    html += section('ref', '레퍼런스', '', refList); chips += '<button class="chip" data-jump="ref">레퍼런스</button>';
    FAMSEC.forEach(([k, l, dot]) => { html += section(k, l, dot, SORTED.filter(c => c.f === k)); chips += '<button class="chip" data-jump="' + k + '"><i style="background:' + dot + '"></i>' + l + '</button>'; });
  }
  chips += '<button class="chip" id="pview" aria-pressed="' + (pview === 'name') + '">' + (pview === 'name' ? '▦ 색만 보기' : '☰ 이름 보기') + '</button>';
  $('#fams').innerHTML = chips; $('#pscroll').innerHTML = html;
  renderPickerHead(); markJump();
}
function applyPick(id) { if (!pickPushed) { push(); pickPushed = true; } setT(pickT, id); renderPickerHead(); draw(); }
function markJump() {
  const sc = $('#pscroll'); let active = null;
  sc.querySelectorAll('.sec').forEach(sec => { if (sec.offsetTop <= sc.scrollTop + 12) active = sec.dataset.sec; });
  document.querySelectorAll('#fams [data-jump]').forEach(b => b.setAttribute('aria-pressed', b.dataset.jump === active));
}
$('#pscroll').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) applyPick(b.dataset.id); });
$('#near').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) applyPick(b.dataset.id); });
$('#pscroll').addEventListener('scroll', markJump, { passive: true });
$('#fams').addEventListener('click', e => {
  if (e.target.closest('#pview')) { pview = pview === 'name' ? 'swatch' : 'name'; renderPickerBody(); const on = document.querySelector('#pscroll .on'); if (on) on.scrollIntoView({ block: 'center' }); return; }
  const b = e.target.closest('[data-jump]'); if (!b) return;
  const sec = document.querySelector('#pscroll [data-sec="' + b.dataset.jump + '"]');
  if (sec) $('#pscroll').scrollTo({ top: sec.offsetTop, behavior: 'smooth' });
});
$('#q').addEventListener('input', () => { renderPickerBody(); $('#pscroll').scrollTop = 0; });
$('#custom').addEventListener('input', e => applyPick(e.target.value.toLowerCase()));
$('#pdone').onclick = closePicker;
$('#prevert').onclick = () => applyPick(pickOrig);
$('#picker .sheet-bg').addEventListener('click', closePicker);
$('#imgview').querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => { $('#imgview').hidden = true; }));

/* ---------- export ---------- */
let downloads = null;
(async () => { try { if (window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; } })();
const coarse = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
let saveBlob = null, saveName = '', outURL = '';
async function exportPNG() {
  const btn = $('#bSave'); if (btn.getAttribute('aria-busy') === 'true') return;
  btn.setAttribute('aria-busy', 'true'); const label = btn.textContent; btn.textContent = '만드는 중…';
  await new Promise(r => setTimeout(r, 40));
  try {
    const c = document.createElement('canvas'); paint(c, S.res); texCache.clear();
    const name = ('配色_' + col(S.bg).n + '_' + S.blocks.map(b => col(b).n).join('-')).replace(/[#\\/:*?"<>|]/g, '').slice(0, 120) + '.png';
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (downloads) {
      try { await downloads.save({ filename: name, data: blob }); toast('저장했어요'); }
      catch (err) { const code = err && err.code; if (code === 'declined') toast('저장을 취소했어요'); else if (code === 'rate_limited') toast('잠시 후 다시 눌러 주세요'); else openSave(blob, name, false, c); }
    } else if (coarse) openSave(blob, name, true, c);
    else fileDownload(blob, name);
  } finally { btn.textContent = label; btn.removeAttribute('aria-busy'); draw(); }
}
function fileDownload(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
  toast(coarse ? '‘파일’ 앱의 다운로드 폴더에 저장돼요' : '다운로드를 시작했어요');
}
function openSave(blob, name, withButtons, canvas) {
  saveBlob = blob; saveName = name;
  if (outURL) { URL.revokeObjectURL(outURL); outURL = ''; }
  if (withButtons) { outURL = URL.createObjectURL(blob); $('#outimg').src = outURL; } else $('#outimg').src = canvas.toDataURL('image/png');
  let canShare = false;
  try { canShare = withButtons && !!navigator.canShare && navigator.canShare({ files: [new File([blob], name, { type: 'image/png' })] }); } catch (e) { canShare = false; }
  $('#bShare').hidden = !canShare; $('#bFile').hidden = !withButtons;
  $('#imgview').hidden = false;
}
$('#bShare').onclick = async () => { try { await navigator.share({ files: [new File([saveBlob], saveName, { type: 'image/png' })] }); } catch (e) { if (!e || e.name !== 'AbortError') toast('공유 창을 열 수 없어요 · 이미지를 길게 눌러 저장하세요'); } };
$('#bFile').onclick = () => fileDownload(saveBlob, saveName);
$('#bSave').onclick = exportPNG;

/* ---------- misc ---------- */
let tt = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }
window.addEventListener('keydown', e => {
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA/.test(a.tagName) && a.type !== 'range';
  if (e.key === 'Escape') { closePicker(); $('#imgview').hidden = true; return; }
  if (typing) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.code === 'Space' && $('#picker').hidden) { e.preventDefault(); randBg(); }
});
function refreshAll() { renderRows(); renderOpts(); renderCands(); renderFavs(); draw(); }
$('#ncount').textContent = LIST.length;
refreshAll();
</script>
</body>
</html>
